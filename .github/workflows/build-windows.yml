name: Build Windows VST3 and Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake --preset windows-release

      - name: Build VST3 and Standalone
        run: cmake --build --preset windows-release

      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $src = "Build-Windows/AfroVocalPresets_artefacts/Release/VST3/AfroVocal Presets.vst3"
          $stage = "release/AfroVocal Presets.vst3"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse -Force $src $stage
          if (-not (Test-Path "$stage/Contents/x86_64-win/AfroVocal Presets.vst3")) { throw "Expected x86_64 VST3 binary was not staged" }
          Compress-Archive -Path $stage -DestinationPath "release/AfroVocal-Presets-Windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "installer\AfroVocalPresets.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "release\AfroVocal-Presets-Setup-x64.exe")) { throw "Installer output was not created" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash "release\AfroVocal-Presets-Setup-x64.exe" -Algorithm SHA256 | Format-List | Out-File "release\AfroVocal-Presets-Setup-x64.sha256.txt"
          Get-FileHash "release\AfroVocal-Presets-Windows-x64.zip" -Algorithm SHA256 | Format-List | Out-File "release\AfroVocal-Presets-Windows-x64.sha256.txt"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AfroVocal-Presets-Windows-Installer-x64
          path: |
            release/AfroVocal-Presets-Setup-x64.exe
            release/AfroVocal-Presets-Setup-x64.sha256.txt
          if-no-files-found: error

      - name: Upload portable Windows VST3 package
        uses: actions/upload-artifact@v4
        with:
          name: AfroVocal-Presets-Windows-x64
          path: |
            release/AfroVocal-Presets-Windows-x64.zip
            release/AfroVocal-Presets-Windows-x64.sha256.txt
          if-no-files-found: error

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: AfroVocal-Presets-Windows-Standalone
          path: Build-Windows/AfroVocalPresets_artefacts/Release/Standalone/**
          if-no-files-found: warn
